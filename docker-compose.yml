# The gatetest.io website + sandbox worker + postgres. What the image is,
# what it is not, and every env var the two services read: docs/ops/docker.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Same ${VAR:-default} expansions the app/worker DATABASE_URLs use. They
    # were previously literals here, so setting POSTGRES_PASSWORD in the
    # environment moved the app's connection string but NOT the database that
    # was actually created — the stack simply failed to connect. The defaults
    # stay for a zero-config `docker compose up`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatetest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatetest}
      POSTGRES_DB: ${POSTGRES_DB:-gatetest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatetest}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to loopback. The default password is a dev convenience; publishing
      # it on 0.0.0.0 would expose a `gatetest`/`gatetest` database to the LAN
      # (and to the internet on a public box). Local psql still works.
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped into /api/platform-status so a stale image is visible.
        # `GIT_COMMIT=$(git rev-parse HEAD) docker compose build`.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      # Secrets live here, gitignored; copy website/.env.example to start.
      # Optional so the first `docker compose config` works before it exists.
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gatetest}:${POSTGRES_PASSWORD:-gatetest}@postgres:5432/${POSTGRES_DB:-gatetest}?sslmode=disable
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # Absolute: the image's WORKDIR is /app/website, the worker is /app/scripts.
    command: ["node", "/app/scripts/sandbox-worker.js"]
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gatetest}:${POSTGRES_PASSWORD:-gatetest}@postgres:5432/${POSTGRES_DB:-gatetest}?sslmode=disable
      GATETEST_BASE_URL: http://app:3000
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
