<!doctype html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin console — final mock</title>
<script>
/* Same contract as website/app/admin/theme-script.ts: a stored light|dark choice wins, otherwise the OS decides. Runs before paint, so no flash. */
(function(){try{var r=document.documentElement;var t=localStorage.getItem("gatetest-admin-theme");if(t==="light"||t==="dark")r.setAttribute("data-theme",t);var d=localStorage.getItem("gatetest-admin-density");if(d==="compact"||d==="comfortable")r.setAttribute("data-density",d);}catch(e){}})();
</script>
<style>
/*FONTS*/
/* ================= tokens: the admin.css contract (#690), re-valued =================
   light in bare :root, dark under prefers-color-scheme guarded by :not([data-theme=light]), dark again under [data-theme=dark].
   Names are the real --gt-admin-* names. No success / warning / danger token exists. */
:root{
  --gt-admin-bg:#ffffff; --gt-admin-surface:#ffffff; --gt-admin-surface-2:#f6f7f8;
  --gt-admin-line:#e4e7eb; --gt-admin-line-strong:#c5cbd2;
  --gt-admin-ink-1:#0b0f14; --gt-admin-ink-2:#3f4752; --gt-admin-ink-3:#687280; --gt-admin-ink-off:#a3aab3;
  --gt-admin-accent:#0f766e; --gt-admin-accent-soft:rgba(15,118,110,.10); --gt-admin-accent-fg:#ffffff;
  --gt-admin-overlay:rgba(11,15,20,.32); --gt-admin-shadow:0 12px 32px rgba(11,15,20,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --gt-admin-bg:#000000; --gt-admin-surface:#0b0b0c; --gt-admin-surface-2:#141518;
    --gt-admin-line:#26282d; --gt-admin-line-strong:#3b3f46;
    --gt-admin-ink-1:#f2f3f5; --gt-admin-ink-2:#aab0b9; --gt-admin-ink-3:#7a818b; --gt-admin-ink-off:#50555d;
    --gt-admin-accent:#2dd4bf; --gt-admin-accent-soft:rgba(45,212,191,.12); --gt-admin-accent-fg:#00201c;
    --gt-admin-overlay:rgba(0,0,0,.64); --gt-admin-shadow:0 12px 32px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --gt-admin-bg:#000000; --gt-admin-surface:#0b0b0c; --gt-admin-surface-2:#141518;
  --gt-admin-line:#26282d; --gt-admin-line-strong:#3b3f46;
  --gt-admin-ink-1:#f2f3f5; --gt-admin-ink-2:#aab0b9; --gt-admin-ink-3:#7a818b; --gt-admin-ink-off:#50555d;
  --gt-admin-accent:#2dd4bf; --gt-admin-accent-soft:rgba(45,212,191,.12); --gt-admin-accent-fg:#00201c;
  --gt-admin-overlay:rgba(0,0,0,.64); --gt-admin-shadow:0 12px 32px rgba(0,0,0,.7);
  color-scheme:dark;
}
/* short aliases for this mock's component CSS only */
:root{
  --bg:var(--gt-admin-bg); --surface:var(--gt-admin-surface); --surface-2:var(--gt-admin-surface-2);
  --line:var(--gt-admin-line); --line-strong:var(--gt-admin-line-strong);
  --ink-1:var(--gt-admin-ink-1); --ink-2:var(--gt-admin-ink-2); --ink-3:var(--gt-admin-ink-3); --ink-off:var(--gt-admin-ink-off);
  --accent:var(--gt-admin-accent); --accent-soft:var(--gt-admin-accent-soft); --accent-fg:var(--gt-admin-accent-fg);
  --overlay:var(--gt-admin-overlay); --shadow:var(--gt-admin-shadow);
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --row:28px; --cell:10px; --gutter:24px;
}
:root[data-density="comfortable"]{ --row:40px; --cell:12px; }

/* ================= base ================= */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink-1)}
body{font-family:var(--sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono,code,kbd,.id{font-family:var(--mono);font-variant-numeric:tabular-nums}
.id{font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
a{color:inherit;text-decoration:none}
a.lnk,button.lnk{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
a.lnk:hover,button.lnk:hover{text-decoration-color:var(--ink-1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:20px;line-height:28px;letter-spacing:-.01em} h2{font-size:13px;line-height:18px} h3{font-size:13px;line-height:18px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--ink-3)} .sec{color:var(--ink-2)} .w5{font-weight:500} .w6{font-weight:600}
.s12{font-size:12px;line-height:16px} .s13{font-size:13px;line-height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
kbd.k{display:inline-block;white-space:nowrap;font-size:11px;line-height:16px;min-width:16px;text-align:center;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2);background:var(--surface)}

/* ================= marks: one SVG sprite, one optical size ================= */
.mk{width:12px;height:12px;flex:none;display:inline-block;vertical-align:-1px;color:var(--ink-1)}
.mk-low,.mk-notrun{color:var(--ink-3)}
.mk-pass{color:var(--accent)}
.sev{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sev-blocker{font-weight:600} .sev-low,.sev-notrun{color:var(--ink-3)}
.w2{display:inline-block;font:500 10px/12px var(--mono);letter-spacing:.04em;border:1px dashed var(--ink-3);color:var(--ink-3);border-radius:3px;padding:0 3px;margin-left:6px;vertical-align:1px;cursor:help}

/* ================= shell ================= */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 10px;font-weight:600;font-size:14px}
.brand .g{width:20px;height:20px;border-radius:5px;background:var(--ink-1);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600}
.brand .env{margin-left:auto;font:400 11px/16px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav{display:flex;flex-direction:column}
.nav .group{font-size:12px;line-height:16px;color:var(--ink-3);padding:14px 10px 4px;font-weight:500}
.nav a{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border-radius:6px;color:var(--ink-2);font-size:13px}
.nav a:hover{background:var(--surface-2);color:var(--ink-1)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink-1);font-weight:500}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.sig{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:400 12px/16px var(--mono);color:var(--ink-2)}
.sig.b{font-weight:600;color:var(--ink-1)}
.sig .mk{width:10px;height:10px}
.rail-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.rail-foot .phone-only{display:none;align-items:center;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:48px;padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.crumb{font:400 12px/16px var(--mono);color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink-1);font-weight:500}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border:1px solid var(--line-strong);border-radius:6px;color:var(--ink-3);font-size:13px;width:280px;min-width:0;background:var(--surface)}
.searchbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchbtn kbd{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;height:30px;flex:none;background:var(--surface)}
.seg button{padding:0 10px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line-strong);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink-1);color:var(--bg);font-weight:500}
.iconbtn{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;display:inline-grid;place-items:center;color:var(--ink-2);font-size:13px;flex:none;background:var(--surface)}
.menubtn{display:none}
.content{padding:20px var(--gutter) 72px;width:100%;max-width:1360px}
.screen{display:none}.screen.on{display:block}
.scrim{display:none}

/* ================= page header, buttons, chips ================= */
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ph .sub{font-size:13px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);font-size:13px;font-weight:500;color:var(--ink-1);background:var(--surface);white-space:nowrap;flex:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink-1);border-color:var(--ink-1);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink-1)}
.btn kbd.k{font-size:10px;line-height:14px;min-width:14px;padding:0 3px}
.btn.primary kbd.k{background:transparent;color:var(--bg);border-color:var(--bg);opacity:.7}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.strong{border-color:var(--ink-1);color:var(--ink-1);font-weight:600}
.chip.dash{border-style:dashed}
a.chip:hover{border-color:var(--ink-1);color:var(--ink-1)}

/* ================= panels: three read states ================= */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.panel[data-state="cannot"]{border-style:dashed;border-color:var(--line-strong)}
.panel-h{display:flex;align-items:baseline;gap:8px;padding:12px 16px 8px}
.rs{margin-left:auto;font-size:12px;line-height:16px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rs b{color:var(--ink-1);font-weight:600}
.panel-b{padding:0 16px 14px;flex:1}
.def{border-top:1px solid var(--line);padding:8px 16px 10px;font-size:12px;line-height:16px;color:var(--ink-3)}
.fail{border-left:2px solid var(--ink-1);background:var(--surface-2);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;line-height:18px}
.fail .t,.cannot .t{font-weight:600;color:var(--ink-1)}
.fail .ep{font:400 12px/16px var(--mono);color:var(--ink-3);margin-top:6px;overflow-wrap:anywhere}
.acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.cannot{font-size:13px;line-height:18px;color:var(--ink-2)}
.cannot .t{display:flex;align-items:center;gap:6px}
.verified{font-size:13px;line-height:18px;color:var(--ink-2)}
.verified .t{font-weight:600;color:var(--ink-1);display:flex;align-items:center;gap:6px}
.verified .ep{font:400 12px/16px var(--mono);color:var(--ink-3);overflow-wrap:anywhere;margin-top:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px;line-height:18px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.big{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mid{font-size:16px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack>*+*{margin-top:12px}

/* ================= strips (per-cell state) ================= */
.strip{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>.cell{background:var(--surface);padding:10px 14px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
a.cell:hover{background:var(--surface-2)}
.cell .l{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{font-size:16px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v.mono{font-size:14px}
.cell .d{font-size:12px;line-height:16px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell[data-state="cannot"]{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 8px)}
.cell[data-state="failed"]{box-shadow:inset 2px 0 0 var(--ink-1),1px 0 0 var(--line),0 1px 0 var(--line)}

/* ================= overview ================= */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto 1fr auto;grid-template-areas:"vhead actions" "vstrip actions" "ready actions" "panels panels";gap:12px 16px;align-items:start}
.ov>.a-vhead{grid-area:vhead}.ov>.a-vstrip{grid-area:vstrip}.ov>.a-ready{grid-area:ready}.ov>.a-actions{grid-area:actions}.ov>.a-panels{grid-area:panels}
.vhead{padding:16px 18px 14px}
.vhead .lbl{display:flex;align-items:center;gap:10px;font-size:12px;line-height:16px;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap}
.vhead .headline{display:flex;align-items:center;gap:10px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
.vhead .headline .mk{width:18px;height:18px}
.vhead .why{font-size:14px;line-height:20px;color:var(--ink-2);margin-top:4px;max-width:760px}
.vhead .week{font-size:14px;line-height:22px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);max-width:820px}
.vhead .week a{color:var(--ink-1);font-weight:500;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
details.how{font-size:12px;line-height:16px;color:var(--ink-3)}
details.how summary{cursor:pointer;list-style:none;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
details.how summary::-webkit-details-marker{display:none}
.howbody{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px;line-height:18px}
.howbody ol{margin:4px 0 0;padding-left:18px}
.nx{list-style:none;margin:0;padding:0}
.nx li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.nx li:focus{outline:none;background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.nx .mk{margin-top:3px}
.nx .t{font-size:13px;line-height:18px;font-weight:500}
.nx .t.b{font-weight:600}
.nx .d{font-size:12px;line-height:16px;color:var(--ink-2);margin-top:2px}
.nx .btn{margin-top:-2px}
.nx li[hidden]{display:none}
.nxmore{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.chart{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--ink-3);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px;border:1px solid var(--ink-1)}
.legend i.solid{background:var(--ink-1)}
.legend i.hatch{border:1px dashed var(--ink-3);background:repeating-linear-gradient(135deg,var(--ink-3) 0 1px,transparent 1px 4px)}
.legend i.tick{width:0;height:10px;border:0;border-left:1px dashed var(--ink-3)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:18px}
.rows li:first-child{border-top:0;padding-top:0}
.rows .d{grid-column:1 / -1;font-size:12px;line-height:16px;color:var(--ink-3)}

/* ================= tables ================= */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;line-height:18px}
th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);height:32px;padding:0 var(--cell);border-bottom:1px solid var(--line);white-space:nowrap}
th[aria-sort]::after{content:" \2193";color:var(--ink-2)}
td{height:var(--row);padding:0 var(--cell);border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th.num,td.num{text-align:right}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3}
tbody tr[tabindex]:hover td{background:var(--surface-2)}
tbody tr[tabindex]:focus{outline:none}
tbody tr[tabindex]:focus td{background:var(--surface-2)}
tbody tr[tabindex]:focus td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
tr.blocker td:first-child{box-shadow:inset 2px 0 0 var(--ink-1)}
tr.grp td{height:30px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2)}
tr.grp td .muted{font-weight:400}
tr.x>td{white-space:normal;height:auto;padding:14px 12px 16px;background:var(--surface-2);position:static}
tr.x .inner{position:sticky;left:12px}
.rowact{display:inline-flex;gap:4px;opacity:0}
tr:hover .rowact,tr:focus .rowact,tr:focus-within .rowact{opacity:1}
.tfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;font-size:12px;line-height:16px;color:var(--ink-3);border-top:1px solid var(--line)}
.cp{font-size:11px;color:var(--ink-3);margin-left:6px;opacity:0;text-decoration:underline;text-underline-offset:2px}
tr:hover .cp,tr:focus .cp,.copyable:hover .cp,.copyable:focus-within .cp{opacity:1}

/* ================= entity header, tabs, filters ================= */
.obj{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.back{font-size:12px;line-height:16px;color:var(--ink-3)}
.otop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.otitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;font-size:20px;line-height:28px}
.otitle .id{font-size:15px;font-weight:500;color:var(--ink-1)}
.otitle .at{color:var(--ink-3);font-weight:400;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;line-height:18px;color:var(--ink-2)}
.meta b{color:var(--ink-1);font-weight:500}
.related{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.related .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
.rel{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);white-space:nowrap}
.rel:hover{border-color:var(--ink-3)}
.rel .k{color:var(--ink-3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs [role="tab"]{height:36px;padding:0 12px;font-size:13px;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tabs [role="tab"]:hover{color:var(--ink-1)}
.tabs [role="tab"][aria-selected="true"]{color:var(--ink-1);font-weight:500;border-bottom-color:var(--ink-1)}
.tabs .n{font:400 12px/16px var(--mono);color:var(--ink-3)}
.tabs [aria-selected="true"] .n{color:var(--ink-1)}
[role="tabpanel"]{display:none}[role="tabpanel"].on{display:block}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.fchip{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface);white-space:nowrap}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{border-color:var(--ink-1);color:var(--ink-1);font-weight:500}
.fchip .n{font-family:var(--mono);color:var(--ink-3)}
.fchip .mk{width:10px;height:10px}
.callout{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface);font-size:13px;line-height:19px;color:var(--ink-2);margin-bottom:12px}
.callout b{color:var(--ink-1);font-weight:600}
.callout .mk{margin-top:3px}
.note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--ink-3);margin-bottom:10px}

/* lifecycle + snippet */
.life{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5.5px;top:8px;bottom:8px;border-left:1px solid var(--line-strong)}
.tl li{position:relative;padding:0 0 12px 24px;font-size:13px;line-height:18px}
.tl li:last-child{padding-bottom:0}
.tl li>.mk{position:absolute;left:0;top:3px;background:var(--surface-2);box-shadow:0 0 0 3px var(--surface-2)}
.tl .h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tl .h .when{margin-left:auto;font-size:12px;color:var(--ink-3)}
.tl .b{color:var(--ink-2);margin-top:2px}
.snip{margin:0;font:400 12px/18px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;color:var(--ink-2)}
.snip .ln{display:inline-block;width:26px;color:var(--ink-off);user-select:none}
.snip b{color:var(--ink-1);font-weight:600}
.verbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* waterfall */
.wf{font-size:12px;line-height:16px}
.wf .r{display:grid;grid-template-columns:140px minmax(0,1fr) 60px 56px;gap:10px;align-items:center;min-height:26px}
.wf .r.h{color:var(--ink-3);border-bottom:1px solid var(--line);margin-bottom:4px}
.wf .track{position:relative;height:10px}
.wf .bar{position:absolute;top:0;height:10px;background:var(--ink-1);border-radius:2px}
.wf .bar.out{background:transparent;border:1px solid var(--ink-1)}
.wf .bar.hatch{background:repeating-linear-gradient(135deg,var(--ink-3) 0 1px,transparent 1px 4px);border:1px dashed var(--ink-3)}

/* customer timeline */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.ctl{list-style:none;margin:0;padding:0}
.ctl .day{font-size:12px;line-height:16px;color:var(--ink-3);font-weight:500;padding:14px 0 6px}
.ctl .day:first-child{padding-top:0}
.ev{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.kind{font:500 11px/18px var(--mono);letter-spacing:.04em;border:1px solid var(--line-strong);border-radius:4px;text-align:center;color:var(--ink-2)}
.kind.fill{background:var(--ink-1);border-color:var(--ink-1);color:var(--bg)}
.ev .what{font-size:13px;line-height:18px;min-width:0}
.ev .what .mk{margin-right:6px}
.ev .sub{font-size:12px;line-height:16px;color:var(--ink-3);margin-top:2px}
.ev .amt{font:400 13px/18px var(--mono);text-align:right;white-space:nowrap}
.ev .amt small{display:block;font:400 11px/14px var(--sans);color:var(--ink-3)}

/* ================= overlays ================= */
.overlay{position:fixed;inset:0;z-index:70;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
.overlay.on{display:flex}
.pal{width:660px;max-width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;border-bottom:1px solid var(--line)}
.pal input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink-1);outline:none}
.pal input::placeholder{color:var(--ink-3)}
.pal .list{max-height:54vh;overflow:auto;padding:6px}
.pal .grp{font-size:12px;line-height:16px;color:var(--ink-3);padding:10px 10px 4px;font-weight:500}
.pal .it{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;min-height:36px;padding:0 10px;border-radius:6px;font-size:13px;line-height:18px;cursor:pointer}
.pal .it .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal .it .r{font-size:12px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pal .it[aria-selected="true"]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.pal .ico{font:500 10px/16px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;text-align:center}
.pal .state{padding:12px 12px 14px;font-size:13px;line-height:18px;color:var(--ink-2)}
.pal .state .t{font-weight:600;color:var(--ink-1);display:flex;align-items:center;gap:6px}
.pal .state .ep{font:400 12px/16px var(--mono);color:var(--ink-3);margin-top:4px}
.pal .state.failed{border-left:2px solid var(--ink-1);margin:6px;background:var(--surface-2);border-radius:0 6px 6px 0}
.pal .foot{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--ink-3)}
.pal .foot button{text-decoration:underline;text-underline-offset:2px}
.dlg{width:460px;max-width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:18px}
.dlg h2{font-size:16px;line-height:24px}
.dlg p{font-size:13px;line-height:19px;color:var(--ink-2);margin-top:6px}
.dlg label{display:block;font-size:12px;color:var(--ink-3);margin-top:12px}
.dlg textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:13px;color:var(--ink-1);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;min-height:64px;resize:vertical}
.dlg .acts{justify-content:flex-end}
.map{width:440px}
.map dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin:10px 0 0;font-size:13px}
.map dt{color:var(--ink-2)} .map dd{margin:0;text-align:right}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;background:var(--ink-1);color:var(--bg);font-size:13px;line-height:18px;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);display:none;max-width:calc(100vw - 32px)}
.toast.on{display:block}
@media (prefers-reduced-motion:no-preference){
  .overlay.on .pal,.overlay.on .dlg{animation:pop .12s ease-out}
  .rail{transition:transform .16s ease-out}
}
@keyframes pop{from{transform:translateY(-6px);opacity:.6}to{transform:none;opacity:1}}

/* ================= responsive ================= */
@media (max-width:1180px){
  .ov{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"vhead" "actions" "vstrip" "ready" "panels"}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .life{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--gutter:16px}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;transform:translateX(-100%);visibility:hidden}
  .rail.open{transform:none;box-shadow:var(--shadow);visibility:visible}
  .scrim.on{display:block;position:fixed;inset:0;z-index:55;background:var(--overlay)}

  tr.x .inner{max-width:calc(100vw - 2*var(--gutter) - 26px)}
}
@media (max-width:700px){

  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .searchbtn kbd{display:none}
  .otitle .id{font-size:14px}
  .panel-h{flex-wrap:wrap}
  .rs{white-space:normal}
}
