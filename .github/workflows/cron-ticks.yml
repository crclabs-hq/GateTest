name: Cron Ticks (off-Vercel stopgap)

# KI #41: production runs on Tallrig — named Vapron until 2026-09-14 (Craig 2026-07-14, re-confirmed
# 2026-07-23) and nothing off-Vercel fires the two cron endpoints, so queued
# push-scans stall and watches never run. The REAL fix is the platform's own
# scheduler (see docs/deploy/VAPRON-DEPLOY.md §3 — crontab / systemd timer
# every 2 and 5 minutes). This workflow is the sanctioned stopgap so the
# Continuous ($49/mo) tier works the moment the CRON_SECRET repo secret is
# set, even before the box-level cron lands.
#
# - FAILS LOUDLY while the CRON_SECRET secret is unset. It used to `exit 0`
#   with the message "stopgap disarmed, nothing to do", which meant this job
#   reported GREEN every 5 minutes while the production scan queue was not
#   being drained at all. That is exactly the silent failure the Bible's
#   Forbidden #16 prohibits, and it is why the stall went unnoticed: pushes
#   were enqueued and never scanned, so no commit status was ever posted.
#   A red X here is correct — it is a real production outage, and it clears
#   the moment the secret is set on BOTH sides (see the error message below).
# - GitHub schedule granularity is ~5 min and often delayed — good enough as
#   a stopgap, NOT a replacement for the box cron. Delete this file once
#   the platform's scheduler is confirmed firing.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit tick endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://gatetest.io
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is NOT SET — the production scan queue is not being drained. Pushes are enqueued by /api/webhook and never executed, so NO commit status or PR comment is ever posted. Fix: set the SAME value in both places — (1) gh secret set CRON_SECRET --repo crclabs-hq/gatetest, and (2) CRON_SECRET in the Tallrig production environment. They must match or the tick 401s."
            exit 1
          fi
          for path in /api/scan/worker/tick /api/watches/tick; do
            code=$(curl -s -o /tmp/tick-body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 120 \
              -d '{}' "$BASE_URL$path" || echo "000")
            echo "$path -> HTTP $code"
            if [ "$code" = "401" ]; then
              echo "::error::$path returned 401 — CRON_SECRET here does not match the one on the production host."
              exit 1
            fi
            # 000/5xx: host briefly unreachable — next tick retries; don't page.
          done
