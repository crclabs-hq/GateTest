name: Empire Smoke (cross-product)

# Cross-product uptime probe over Craig's three live deployments: Tallrig (the
# platform — named Vapron until 2026-09-14, Crontech before that),
# Gluecron and GateTest.
#
# WHY THIS FILE EXISTS
# --------------------
# `.gatetest.json` carried a `triggers.schedule` entry declaring that
# `empire-smoke` should run every 5 minutes. Nothing reads `triggers` — the
# key was decorative — so the probe had NEVER RUN, from the day it was
# written until 2026-08-29. That was Known Issue #102.
#
# It had rotted accordingly. Crontech was renamed Vapron on 2026-06-12 and
# three of its five probes could not have passed: api.crontech.ai and
# gluecron.crontech.ai no longer resolve, the homepage probe demanded the
# body say "Crontech" when vapron.ai serves "Vapron", and the health probe
# demanded `ok:true` when Vapron answers `{"status":"ok"}`. All fixed and
# verified green against the live estate before this workflow was added — a
# monitor whose first run is red teaches everyone to ignore it.
#
# WHAT IT COVERS THAT readiness-probe.yml DOES NOT
# ------------------------------------------------
# readiness-probe.yml asks "is GateTest production ready?" every 30 minutes.
# This asks "is the estate up?" — Tallrig and Gluecron are not covered by
# anything else, and the crontech.ai -> tallrig.com redirect is load-bearing
# for every pre-rename link while being invisible to every other check.
#
# Needs no secrets: every probe is a GET, a DNS lookup or a TLS handshake
# against a public endpoint. A monitor that needs credentials tends not to
# get set up, and one that holds them is a liability on a public repo.

on:
  schedule:
    # DO NOT read this as "runs every 5 minutes". It does not, and the
    # evidence is in this repo: readiness-probe.yml is configured `*/30`, and
    # on 2026-08-29 its actual scheduled runs landed at 01:29, 08:16, 13:57,
    # 17:38 and 20:32 UTC — gaps of three to SEVEN HOURS against a
    # thirty-minute cron. GitHub schedules are best-effort and are throttled
    # hard on public repos; the declared interval is a request, not a promise.
    #
    # The real 5-minute cadence therefore lives on the production box, as a
    # systemd timer (scripts/deploy/systemd/gatetest-empire-smoke.timer) —
    # the same conclusion scripts/deploy/systemd/README.md reached for the
    # queue drain, and the same Forbidden #3 argument.
    #
    # This workflow is kept for what Actions IS good at and the box is not:
    # alerting on a red run (email + an archived report artifact), from
    # outside our own network, so it still sees us when the box does not.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One at a time. At a 5-minute cadence a delayed run can otherwise overlap
# its successor and double the noise for a single outage.
concurrency:
  group: empire-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Retry once before going red. A single dropped packet on a public
      # runner is not an outage, and at 288 runs a day a zero-tolerance
      # probe would page on noise until everyone muted it. Two consecutive
      # failures 30s apart is a real signal.
      #
      # Exit codes from empire-smoke.js: 0 = green or yellow, 1 = red.
      # Yellow ("up but slow", or a cert inside its 14-day window) is
      # surfaced in the summary WITHOUT failing the job — see the CLI block
      # in integrations/smoke/empire-smoke.js for why.
      - name: Probe the estate
        id: probe
        run: |
          set +e
          node integrations/smoke/empire-smoke.js > smoke.md
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "First attempt failed; retrying once in 30s before alerting."
            sleep 30
            node integrations/smoke/empire-smoke.js > smoke.md
            code=$?
          fi
          cat smoke.md
          cat smoke.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Always keep the machine-readable report, including on failure, so a
      # red run can be diagnosed without re-running it by hand.
      - name: JSON report
        if: always()
        run: |
          # The probe exits 1 when the estate is red. That is EXPECTED here —
          # the blocking "Probe the estate" step above already owns the job's
          # verdict, and this step only has to leave a machine-readable report
          # behind. What is NOT expected is the probe failing to produce a
          # report at all: a crashed probe and a green estate both used to look
          # like an empty artifact under a blanket `|| true`. So tolerate the
          # exit code, then assert the artifact is real.
          rc=0
          node integrations/smoke/empire-smoke.js --json > smoke.json || rc=$?
          if ! jq -e 'has("status")' smoke.json > /dev/null; then
            echo "empire-smoke --json produced no usable report (exit $rc)" >&2
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empire-smoke-report
          path: |
            smoke.md
            smoke.json
          retention-days: 7
