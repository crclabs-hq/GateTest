name: Readiness Probe (production)

# Answers "are we production ready?" continuously, against the LIVE site,
# instead of inferring it from a green test suite.
#
# It exists because on 2026-07-27/28 the suite was green — 6,700+ tests
# passing, clean build, self-scan gate PASSED — while production was 102
# commits stale, `/billing` returned 404, `POST /api/watches/tick` returned
# 405, and paid MCP customers received no API key. None of that is visible
# to a test. All of it is obvious to something that asks the live site a
# question. That stale deploy went unnoticed for ELEVEN DAYS; this job
# would have gone red on the first run after it.
#
# Safe to run unattended: every step is a GET, a POST we expect to be
# REJECTED, or the free public scan of our OWN public repo. It never
# completes a payment and never writes customer data, so it needs no secrets
# — which is the point. A monitor that requires credentials tends not to get
# set up.
#
# A red X here is a real customer-facing problem, not flakiness.
#
# 2026-08-16 — this job ran red 100 times in a row over five days without
# catching the outage that mattered. It reported production 10/11 healthy
# while the free scan told every visitor their repository was empty. Three
# blind spots, all now closed and regression-tested:
#   * it never ran the product, so it could not see the product was dead
#   * "deploy/fresh" only asserted a commit stamp EXISTED — a 10-day-old
#     build passed a check named "fresh"
#   * it read /api/status's missing_* lists but not invalid_placeholders,
#     which had been naming the dead GATETEST_PRIVATE_KEY the whole time
# The summary now says PRODUCT BROKEN when the funnel is down, so a new
# failure is legible inside a red that has become familiar.

on:
  schedule:
    # Every 30 minutes. Frequent enough that a bad deploy is caught before
    # the working day notices; infrequent enough to stay quiet.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to probe'
        required: false
        default: 'https://gatetest.io'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the drift step below counts commits between the
          # deployed sha and origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOTE: deliberately NOT --expect-head. On a schedule this runs from
      # the default branch, and main legitimately moves ahead of production
      # between deploys — asserting an exact match would make this job red
      # by design and train everyone to ignore it. It still fails when the
      # build carries no commit stamp at all, which is the case that means
      # "we cannot tell fresh from stale".
      #
      # Use the workflow_dispatch run with --expect-commit right AFTER a
      # deploy to prove that specific deploy landed.
      # The base URL goes through `env:`, never interpolated straight into
      # `run:`. A workflow_dispatch input is attacker-influenced text, and
      # `${{ ... }}` inside a run block is substituted BEFORE the shell sees
      # it — so a crafted input executes as shell. GateTest's own ciSecurity
      # module flagged this on the first version of this file, which is a
      # fair result for a security product to get from itself.
      - name: Probe production
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://gatetest.io' }}
        run: node scripts/ops/readiness-probe.js --base "$BASE_URL"

      # Production must be running main. The probe's own deploy/fresh step
      # deliberately does not assert an exact commit (main moves ahead of
      # production between deploys); this step does, with a grace window
      # for a deploy still in flight. Without it the probe was green on
      # 2026-09-15/16 while production served 3884051c, 35 commits behind
      # main, because deploy-box.yml had refused every push on box-side
      # uncommitted changes and nothing else asked the question.
      #
      # scripts/ops/verify-deploy.js exits 0 in sync (or lagging but the
      # expected commit is younger than the grace), 1 lagging / not on main,
      # 2 unreachable. Runs even when the probe above already failed, so a
      # red probe still says whether production is stale.
      - name: Production runs main (deploy drift)
        if: always()
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://gatetest.io' }}
        run: |
          expected=$(git rev-parse origin/main)
          node scripts/ops/verify-deploy.js --base "$BASE_URL" --expect "$expected" --grace-minutes 30
      - name: Probe production (JSON artifact)
        if: always()
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://gatetest.io' }}
        run: |
          # readiness-probe.js exit codes: 0 = ready, 1 = NOT ready, 2 = the
          # probe itself could not run. 1 is expected here — the blocking step
          # above already decided the job — but 2 means we are uploading an
          # artifact that says nothing, which is how a dead probe passes for a
          # healthy site. Tolerate 1; surface 2.
          rc=0
          node scripts/ops/readiness-probe.js --base "$BASE_URL" --json > readiness.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "readiness probe could not run (exit $rc) — see stderr above" >&2
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-report
          path: readiness.json
          retention-days: 14
