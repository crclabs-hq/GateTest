# Publish the VS Code extension to the Visual Studio Marketplace.
#
# Manual only (workflow_dispatch). The Marketplace token never leaves GitHub:
# it is the repo secret VSCE_PAT (an Azure DevOps PAT with the Marketplace
# "Manage" scope for the publisher named in vscode-extension/package.json),
# read by vsce from the environment. Nobody types it into a terminal or a chat.
#
# Each registry is one secret (VSCE_PAT, OVSX_PAT); a missing one skips that
# registry with a warning and the run fails only if neither is set.
#
# dry_run=true builds and packages, uploads the .vsix as a run artifact, and
# stops before publishing — the way to prove the package is sound before the
# publisher exists. Publishing is idempotent per version: each publish step
# first asks its registry whether this version is already there and, if so,
# prints "already on ..." and exits 0, so a re-run after a partial failure
# (one registry published, the other not) finishes the job instead of failing
# on "version already exists". Each step reports published / already-published /
# skipped, and the last step fails the run only if no registry has the package.
name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package + upload the .vsix only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.dry_run && 'Package (dry run)' || 'Package + publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Bridge tests (the in-process engine contract, from the repo root)
        working-directory: .
        run: node --test tests/vscode-extension-engine-bridge.test.js

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          publisher="$(node -p "require('./package.json').publisher")"
          npx vsce package --out "gatetest-${version}.vsix"
          ls -la "gatetest-${version}.vsix"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publisher=${publisher}" >> "$GITHUB_OUTPUT"
          echo "vsix=vscode-extension/gatetest-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: gatetest-${{ steps.pkg.outputs.version }}.vsix
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

      # .vscodeignore whitelists node_modules down to the engine and its three
      # runtime dependencies (3,580 files → ~340). A whitelist fails quietly — a
      # forgotten dependency is a module the registry skips with a warning — so
      # this opens the .vsix just built, loads every declared engine module from
      # it and runs a quick scan through engine-worker.js. Runs after the upload
      # so the artifact is there to inspect when it fails, and before any publish.
      - name: Smoke the packaged .vsix (every engine module loads; a scan completes)
        env:
          GATETEST_VSIX: gatetest-${{ steps.pkg.outputs.version }}.vsix
        run: node --test test/packaged-vsix.test.js

      - name: Publish to the Marketplace
        id: marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISHER: ${{ steps.pkg.outputs.publisher }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT}" ]; then
            echo "::warning::VSCE_PAT repo secret is not set — skipped the VS Code Marketplace. Create an Azure DevOps PAT (Marketplace: Manage) for publisher '${PUBLISHER}' and add it under Settings → Secrets → Actions, then re-run."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already published? The public gallery query lists the versions the
          # Marketplace has (filterType 7 = extension name, flags 1 = include
          # versions). A check that cannot be answered — network, an unexpected
          # shape — yields an empty list and falls through to publishing, which
          # still fails loudly on a duplicate; nothing is ever skipped on a guess.
          listed="$(curl -sS --max-time 30 -X POST 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"${PUBLISHER}.gatetest\"}]}],\"flags\":1}" \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => { s += d; }).on("end", () => {
                try {
                  const ext = JSON.parse(s).results[0].extensions[0];
                  process.stdout.write((ext.versions || []).map((v) => v.version).join(" "));
                } catch { process.stdout.write(""); }
              });' || true)"
          echo "Marketplace has versions: ${listed:-<none / unknown>}"
          case " ${listed} " in
            *" ${VERSION} "*)
              echo "${PUBLISHER}.gatetest@${VERSION} is already on the VS Code Marketplace — nothing to publish"
              echo "result=already-published" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          npx vsce verify-pat "${PUBLISHER}"
          npx vsce publish --packagePath "gatetest-${VERSION}.vsix"
          echo "result=published" >> "$GITHUB_OUTPUT"
          echo "Published ${PUBLISHER}.gatetest@${VERSION} — https://marketplace.visualstudio.com/items?itemName=${PUBLISHER}.gatetest"

      # Open VSX is the registry Cursor, Windsurf, VSCodium and Gitpod read —
      # they do NOT read Microsoft's Marketplace. Same .vsix, second registry.
      # Skipped, loudly, until the OVSX_PAT repo secret exists (open-vsx.org →
      # namespace `GateTestHQ` → Access Tokens) so a missing token never fails
      # the Marketplace publish that just succeeded.
      - name: Publish to Open VSX (Cursor / Windsurf / VSCodium)
        id: ovsx
        if: ${{ !inputs.dry_run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PUBLISHER: ${{ steps.pkg.outputs.publisher }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT repo secret is not set — skipped Open VSX. Create the '${{ steps.pkg.outputs.publisher }}' namespace at open-vsx.org, mint an access token, add it as OVSX_PAT, and re-run this workflow."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The namespace must exist before verify-pat/publish. "already exists" is the only
          # expected failure and is treated as success so re-runs stay green.
          if ! npx ovsx create-namespace "${{ steps.pkg.outputs.publisher }}" -p "${OVSX_PAT}" 2>/tmp/ovsx-ns; then
            if grep -qi "already exists" /tmp/ovsx-ns; then
              echo "Open VSX namespace ${{ steps.pkg.outputs.publisher }} already exists"
            else
              cat /tmp/ovsx-ns; echo "::error::Could not create the Open VSX namespace '${{ steps.pkg.outputs.publisher }}'"; exit 1
            fi
          fi
          npx ovsx verify-pat "${{ steps.pkg.outputs.publisher }}" -p "${OVSX_PAT}"
          # Already published? Open VSX answers 200 for a version it has and 404
          # otherwise. Any other answer (network, 5xx) falls through to publishing,
          # which still fails loudly on a duplicate — nothing is skipped on a guess.
          url="https://open-vsx.org/api/${PUBLISHER}/gatetest/${VERSION}"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${url}" || true)"
          if [ "${code:-000}" = "200" ]; then
            echo "${PUBLISHER}.gatetest@${VERSION} is already on Open VSX — nothing to publish (${url})"
            echo "result=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Open VSX answered ${code} for ${url} — publishing"
          npx ovsx publish "gatetest-${VERSION}.vsix" -p "${OVSX_PAT}"
          echo "result=published" >> "$GITHUB_OUTPUT"
          echo "Published to Open VSX — https://open-vsx.org/extension/${PUBLISHER}/gatetest"

      # Either registry alone is a successful run (each is one secret); a run
      # after which NEITHER registry has the package is a failure, never a green
      # nothing (Doctrine #1). Each publish step reports what it did — published,
      # already-published, or skipped (no secret) — and this reads those reports
      # rather than guessing from which secrets exist.
      - name: At least one registry received the package
        if: ${{ !inputs.dry_run }}
        env:
          MARKETPLACE: ${{ steps.marketplace.outputs.result }}
          OVSX: ${{ steps.ovsx.outputs.result }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          echo "VS Code Marketplace: ${MARKETPLACE:-did not report}"
          echo "Open VSX:            ${OVSX:-did not report}"
          case "${MARKETPLACE} ${OVSX}" in
            *published*) exit 0 ;;
          esac
          echo "::error::No registry has gatetest@${VERSION} after this run (Marketplace: ${MARKETPLACE:-did not report}, Open VSX: ${OVSX:-did not report}). Add VSCE_PAT and/or OVSX_PAT under Settings → Secrets → Actions and re-run."
          exit 1
