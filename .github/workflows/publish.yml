name: Publish to npm

on:
  push:
    tags:
      # Release tags only. The moving major tag (v1) this workflow advances
      # matches 'v*' too and would re-run the suite against a tag whose
      # version never equals package.json.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (no actual publish)'
        type: boolean
        default: false

permissions:
  contents: write   # for creating the GitHub Release on tag push
  id-token: write   # for npm provenance AND OIDC trusted publishing

jobs:
  publish:
    name: Test + Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Auth model (2026-07-25, Craig + npm's token changes): OIDC trusted
      # publishing — npmjs.com > @gatetest/cli > Settings > Trusted Publisher
      # is configured with (GitHub Actions, crclabs-hq / GateTest,
      # publish.yml, no environment). No NPM_TOKEN secret, no expiry, no
      # OTP. The 2026-07-24 token attempts died on EOTP because the
      # account's 2FA mode demands a one-time code from ANY token auth;
      # OIDC sidesteps tokens entirely.
      #
      # Node 22 bundles npm 10.x, which predates trusted publishing —
      # npm >= 11.5.1 is required for the OIDC exchange.
      - name: Update npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - name: Install deps
        run: npm ci

      # The suite is the same one ci.yml runs, and it needs the website
      # workspace: cross-fix-syntax-gate loads `typescript` (a website
      # devDependency) and reports "unverified" without it — which failed the
      # v1.61.0 publish on 2026-09-13 (3 checkTsSyntax tests, root-only
      # install). Mirror ci.yml's Test + Build job exactly.
      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Install website dependencies (tests load typescript and @babel/* via website helpers)
        run: cd website && npm ci

      - name: Verify all 121 modules load
        run: node bin/gatetest.js --list >/dev/null

      - name: Run test suite
        # scripts/run-tests.js: one plain `node --test` per file, ended after
        # its summary is read (a leaked handle cannot hang it; a file that
        # exits before its summary fails it). Replaces --test-force-exit,
        # which cut children off mid-stream and still exited 0 (2026-09-05).
        run: node scripts/run-tests.js --timeout 60000 tests/*.test.js

      - name: Verify package version matches the git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "Run: npm version $TAG_VERSION --no-git-tag-version  (then commit + retag)"
            exit 1
          fi
          echo "Tag matches package.json version ✓"

      - name: npm publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --access public --dry-run

      - name: npm publish
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)"
        run: |
          # Idempotent: a re-run (workflow_dispatch after a tag) must not fail
          # on a version the registry already has.
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm — skipping"
            exit 0
          fi
          if ! npm publish --access public --provenance 2> /tmp/npm-publish-err; then
            cat /tmp/npm-publish-err
            if grep -qE "ENEEDAUTH|E401|E404|EOTP" /tmp/npm-publish-err; then
              echo ""
              echo "::error::npm auth failed. This workflow publishes via OIDC trusted publishing — no token."
              echo ""
              echo "  Checklist (npmjs.com, logged in as the package owner):"
              echo ""
              echo "  1. Package page -> @gatetest/cli -> Settings -> Trusted Publisher:"
              echo "       Publisher:          GitHub Actions"
              echo "       Organization/user:  crclabs-hq"
              echo "       Repository:         GateTest"
              echo "       Workflow filename:  publish.yml"
              echo "       Environment name:   (leave blank)"
              echo "       Allowed actions:    Publish (at minimum)"
              echo ""
              echo "  2. The org/repo must match GitHub's CANONICAL name for this repo"
              echo "     (crclabs-hq/GateTest — the ccantynz-alt/gatetest URL is an alias)."
              echo ""
              echo "  3. EOTP specifically means npm fell back to TOKEN auth — if an NPM_TOKEN"
              echo "     secret still exists and npm is too old for OIDC, delete the secret or"
              echo "     check the 'Update npm' step above printed npm >= 11.5.1."
            fi
            exit 1
          fi

      # @gatetest/mcp-server ships from the same tag: it is a thin proxy to
      # @gatetest/cli/bin/gatetest-mcp.mjs and pins the CLI range, so every
      # CLI release must be followed by the MCP package (Craig, 2026-09-13:
      # "the mcp should have been included absolutely"). Same OIDC trusted
      # publishing — the package needs its own Trusted Publisher entry on
      # npmjs.com (Settings -> Trusted Publisher: crclabs-hq / GateTest /
      # publish.yml). Idempotent like the CLI step.
      - name: npm publish @gatetest/mcp-server
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)"
        working-directory: packages/mcp-server
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm — skipping"
            exit 0
          fi
          if ! npm publish --access public --provenance 2> /tmp/npm-publish-mcp-err; then
            cat /tmp/npm-publish-mcp-err
            if grep -qE "ENEEDAUTH|E401|E404|EOTP" /tmp/npm-publish-mcp-err; then
              echo "::error::npm auth failed for $PKG — add a Trusted Publisher on npmjs.com for $PKG (GitHub Actions, crclabs-hq / GateTest, workflow publish.yml, no environment)."
            fi
            exit 1
          fi

      # The Marketplace listing, the README and every customer workflow say
      # `uses: crclabs-hq/GateTest@v1`, and no v1 tag ever existed — the
      # action resolved for nobody (2026-09-14 audit). Move the major tag to
      # every STABLE release once npm has it: v1.61.1 -> v1. A pre-release
      # (v1.62.0-rc.1) leaves v1 where it is, a dry-run never gets here, and
      # a push made with the workflow token does not re-trigger this workflow.
      - name: Advance the moving major tag
        if: success() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          if ! printf '%s' "$MAJOR" | grep -Eq '^v[0-9]+$'; then
            echo "::error::cannot derive a major tag from $GITHUB_REF_NAME"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "$MAJOR -> $GITHUB_SHA ($GITHUB_REF_NAME)"

      # Only after a successful publish: the 2026-09-13 run failed at the test
      # step, skipped npm publish, and still created a public v1.61.0 release
      # for a version the registry did not have.
      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The WordPress plugin zip rides on the same tag. scripts/build-wp-plugin-zip.js
  # writes dist/gatetest-health-check.zip with the plugin folder at the top
  # level (what WordPress's uploader needs) and this attaches it to the
  # release the publish job created, so gatetest.io/wp can link one stable
  # URL: releases/latest/download/gatetest-health-check.zip. A separate job so
  # it can never fail the npm publish and can be re-run on its own.
  wp-plugin-zip:
    name: Attach WordPress plugin zip to the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build gatetest-health-check.zip
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/build-wp-plugin-zip.js

      - name: Upload the zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/gatetest-health-check.zip --clobber
