# Auto-deploy to the production box on every push to main — the job Vercel
# used to do implicitly. INERT until Craig adds the two repository secrets
# below (Settings → Secrets and variables → Actions):
#
#   BOX_SSH_KEY   — private key with access to the deploy user on the box
#   BOX_SSH_HOST  — user@host, e.g. deploy@<box-ip>
#
# "We have Tailscale, so why do we need these?" (Craig, 2026-08-04 — this
# keeps getting re-asked because Tailscale was documented NOWHERE in this repo
# until now). Tailscale solves REACHABILITY, not CI identity:
#
#   * Craig deploying from his own machine  → on the tailnet, no secrets needed.
#   * THIS workflow                          → a GitHub-hosted runner is an
#     ephemeral Azure VM with no tailnet membership. Tailscale alone cannot get
#     it to the box. It needs either public SSH creds (these secrets), or to
#     join the tailnet itself via tailscale/github-action + TS_OAUTH_CLIENT_ID
#     / TS_OAUTH_SECRET.
#
# The runner reaches the box over SSH using BOX_SSH_HOST/BOX_SSH_KEY. If SSH
# access is ever moved to tailnet-only, this workflow breaks until the runner
# is joined to the tailnet.
#
# The box side just needs scripts/deploy/deploy-on-box.sh in the checkout
# (ships with the repo). Activation = Craig's call (Boss Rule: production
# deployment); the workflow skips cleanly while the secrets are absent.
#
# Two jobs. `deploy` ships; `verify` runs AFTERWARDS, whatever happened to
# `deploy`, asks the live site which commit it is serving, and turns a lag
# into ONE open issue labelled `deploy-drift` that closes itself when a
# later run is in sync. A red job is a signal only to someone who opens the
# Actions tab: from 2026-09-15 every push failed on the box's own
# uncommitted changes, production served 3884051c while main moved 35
# commits on, and nobody was told (docs/ROADMAP.md KI #112).
name: Deploy to production box

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover:
        description: "Recover the box first: stash any hand edits (kept, never deleted) and switch the checkout to main"
        type: boolean
        default: false

concurrency:
  group: deploy-box
  cancel-in-progress: false

jobs:
  # SSH-over-the-internet to the box stopped being a working path on
  # 2026-09-16: Box 161 closed public SSH (port 22) as part of estate
  # hardening ("CI keys never get a shell"), so this job now only runs on a
  # manual `workflow_dispatch` — kept alive for the day SSH-over-mesh exists
  # (Tailscale/tailnet CI runner), not for every push. A push deploys via the
  # pull timer on the box instead (gatetest-pull-deploy.timer,
  # docs/deploy/PULL-DEPLOY.md) and is checked by the `poll-pull-deploy` job
  # below, which replaces the push-triggered SSH attempt so a push no longer
  # goes red for a path that cannot work.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Why the deploy did not land, in one line, for the verify job's issue.
      # Empty when it did.
      reason: ${{ steps.outcome.outputs.reason }}
    steps:
      # First, not last: the SSH step below streams THIS checkout's
      # scripts/deploy/deploy-on-box.sh into the box.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets present
        id: gate
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
        run: |
          if [ -z "$BOX_SSH_KEY" ] || [ -z "$BOX_SSH_HOST" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # FAIL, do not warn. History of this exact step:
            #
            #   2026-08-04  It printed one plain line and exited 0. Production
            #               sat 60 commits behind for six days; nothing
            #               surfaced it.
            #   then        Mitigation: make it LOUD — ::warning:: plus a step
            #               summary — but still exit 0, to keep main green.
            #   2026-08-12  It happened AGAIN. Production sat 6 commits behind
            #               for six days on ff0fe9b3 while every push showed
            #               "Deploy to production box / success".
            #
            # The mitigation was tested by reality and lost. A warning on a
            # green run is invisible: nobody opens a passing workflow. The only
            # signal anyone actually sees is a red X, so this now fails.
            #
            # A red deploy job here is not a broken build — it is an ACCURATE
            # report that this push did not reach production. Deploy is not a
            # required status check, so it blocks no merge; it just stops the
            # dashboard from lying. That is Forbidden #16: never silently fail.
            echo "::error title=Deploy skipped — production NOT updated::BOX_SSH_KEY / BOX_SSH_HOST are not set, so this push did not reach production. Add them in Settings → Secrets and variables → Actions to enable auto-deploy."
            {
              echo "### 🚨 Deploy did NOT run — production is unchanged"
              echo
              echo "\`BOX_SSH_KEY\` / \`BOX_SSH_HOST\` are not configured, so the deploy step is inert."
              echo "**Every push to \`main\` leaves production on whatever commit was last deployed by hand.**"
              echo
              echo "This job fails deliberately. It went green while deploying nothing twice"
              echo "(2026-08-04 and 2026-08-12); a warning nobody reads is not a signal."
              echo
              echo "Fix: add both secrets in Settings → Secrets and variables → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        id: ssh
        if: steps.gate.outputs.enabled == 'true'
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          # A boolean input mapped to a literal 1/0 here, never interpolated into the
          # script: only a manual run with the box ticked can set it, a push cannot.
          DEPLOY_RECOVER: ${{ (github.event_name == 'workflow_dispatch' && inputs.recover) && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # App-dir resolution, in order: an explicit GATETEST_APP_DIR on the
          # box, then /opt/gatetest, then $HOME/gatetest.
          #
          # The order matters and used to be wrong. This defaulted straight to
          # $HOME/gatetest, which for the root user is /root/gatetest — the
          # path docs/deploy/JARVIS-WEB-DEPLOY.md explicitly calls "the stale
          # /root/gatetest registry path". The live checkout is /opt/gatetest.
          # Nobody had noticed because the secrets were never set, so this
          # step had never actually run: the first deploy after wiring them up
          # would have either failed on a missing path or, worse, succeeded
          # against a stale checkout and reported green.
          #
          # The script is streamed from THIS checkout (`bash -s` reading stdin),
          # not run from the box's copy. The box's copy is whatever the LAST
          # successful deploy left there, so a fix to the deploy script can
          # never reach the box through the box's own script: on 2026-09-05
          # runs 320–325 all refused themselves on a file the OLD script did
          # not expect (changelog.json), and #463, which fixed the list, was
          # refused by the same old script it was replacing. tests/
          # deploy-self-dirtied.test.js pins this shape.
          #
          # stdout+stderr are tee'd into deploy.log so the `[deploy] ERROR:`
          # line the script prints on refusal can be read by the outcome step
          # below and quoted in the drift issue. pipefail keeps the ssh exit
          # code as the step's.
          case "$DEPLOY_RECOVER" in 1) RECOVER_EXPORT="export DEPLOY_RECOVER=1;" ;; *) RECOVER_EXPORT="export DEPLOY_RECOVER=0;" ;; esac
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$BOX_SSH_HOST" \
            "$RECOVER_EXPORT" \
            'for d in "$GATETEST_APP_DIR" /opt/gatetest "$HOME/gatetest"; do
               [ -n "$d" ] && [ -d "$d/.git" ] && exec env GATETEST_APP_DIR="$d" bash -s;
             done;
             echo "no GateTest checkout found (tried GATETEST_APP_DIR, /opt/gatetest, \$HOME/gatetest)" >&2; exit 1' \
            < scripts/deploy/deploy-on-box.sh 2>&1 | tee deploy.log

      - name: Verify live endpoints
        id: smoke
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sleep 5
          status=$(curl -s --max-time 20 https://gatetest.io/api/status || true)
          echo "$status" | head -c 400
          echo "$status" | grep -q '"ready"' || { echo "::error::/api/status did not return JSON — deploy may not have taken"; exit 1; }

      - name: Record why the deploy did not land
        # Always runs. Produces ONE line the verify job can quote: the
        # `[deploy] ERROR:` line from deploy-on-box.sh when there is one,
        # otherwise which step failed. Empty on success.
        id: outcome
        if: always()
        env:
          GATE_ENABLED: ${{ steps.gate.outputs.enabled }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          reason=""
          if [ "$GATE_ENABLED" != "true" ]; then
            reason="deploy skipped: BOX_SSH_KEY / BOX_SSH_HOST are not set on the repository"
          elif [ "$SSH_OUTCOME" = "failure" ]; then
            # An honest classification, not "deploy-on-box.sh failed": when the
            # SSH connection itself never came up, the script on the box never
            # ran at all, so blaming it is wrong. Box 161 closed port 22 on
            # 2026-09-16 — this branch is now the expected shape of a manual
            # workflow_dispatch run until SSH-over-mesh exists.
            if grep -qE 'ssh: connect to host|Connection timed out|Connection refused' deploy.log 2>/dev/null; then
              reason="box unreachable over SSH (port 22 is closed by design since 2026-09-16) — production deploys by the pull timer on the box; see docs/deploy/PULL-DEPLOY.md"
            else
              reason="$(grep -m1 '\[deploy\] ERROR:' deploy.log 2>/dev/null || true)"
              [ -n "$reason" ] || reason="deploy-on-box.sh failed without a [deploy] ERROR line — read the 'Deploy over SSH' step log"
            fi
          elif [ "$SMOKE_OUTCOME" = "failure" ]; then
            reason="deploy ran but /api/status did not answer with JSON afterwards — the new build may not have taken"
          fi
          # Single line, no newlines, so it fits a $GITHUB_OUTPUT assignment.
          reason="$(printf '%s' "$reason" | tr -d '\r\n' | head -c 1000)"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "$reason" > deploy-failure.txt
            echo "deploy did not land: $reason"
          fi

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: |
            deploy.log
            deploy-failure.txt
          if-no-files-found: ignore
          retention-days: 14

  # Replaces the push-triggered SSH attempt (the `deploy` job above now only
  # runs on workflow_dispatch — SSH to the box stopped working 2026-09-16).
  # Production deploys itself: gatetest-pull-deploy.timer on the box polls
  # origin/main every 5 minutes (docs/deploy/PULL-DEPLOY.md). This job's only
  # job is to say, within 15 minutes of a push, whether that actually happened
  # — never a fake green, never a red run for a path that cannot work.
  #
  # /api/status (the operator-readiness probe — env var names, queue depth)
  # carries NO commit stamp; the field that does is `commit` on
  # /api/platform-status (website/app/api/platform-status/route.ts). That is
  # exactly what src/core/verify-deploy.js already compares against a target
  # sha, so this job reuses it (scripts/ops/verify-deploy.js) in a poll loop
  # instead of re-implementing the comparison.
  poll-pull-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # issues: write is for the "Production deploy stalled" issue only
      # (issue #706 part 2) — every other step here only reads.
      issues: write
    outputs:
      reason: ${{ steps.poll.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the stalled-issue step below lists the merges
          # between the box's live commit and this push with `git log
          # --merges <live>..HEAD`.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll production for the pushed commit (up to 15 minutes)
        id: poll
        run: |
          DEADLINE=$(( $(date +%s) + 900 ))
          SHORT_SHA="${GITHUB_SHA:0:12}"
          while :; do
            if node scripts/ops/verify-deploy.js --expect "$GITHUB_SHA" --json --out verify.json; then
              echo "poll: production is on $GITHUB_SHA"
              echo "reason=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            STATE=$(node -e "let r={};try{r=JSON.parse(require('fs').readFileSync('verify.json','utf8'))}catch{} process.stdout.write(r.state||'')")
            if [ "$STATE" = "unreachable" ]; then
              MESSAGE=$(node -e "let r={};try{r=JSON.parse(require('fs').readFileSync('verify.json','utf8'))}catch{} process.stdout.write(r.message||'')")
              case "$MESSAGE" in
                *"carries no commit stamp"*)
                  echo "::notice title=Deploy check not run::not checked: live endpoint exposes no commit"
                  echo "reason=not checked: live endpoint exposes no commit" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "::error title=Pull timer did not deploy in time::pull timer did not pick up $SHORT_SHA within 15 min"
              echo "reason=pull timer did not pick up $SHORT_SHA within 15 min" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 30
          done

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pull-deploy-poll
          path: verify.json
          if-no-files-found: ignore
          retention-days: 14

      # issue #706 part 2: on a stalled deploy, open or update ONE issue
      # titled "Production deploy stalled" (label `ops`, assignee the repo
      # owner) naming the reason, the unshipped merges, and the box command
      # to run — closed automatically once a later push sees the box caught
      # up. Deliberately separate from the `deploy-drift` issue the `verify`
      # job below manages: that one asks "is the live commit behind main";
      # this one asks "is the box's OWN pull-deploy.sh reporting failure",
      # using the reason it already wrote to its status file
      # (/api/platform-status `lastPullDeploy`) — a narrower signal that
      # fires even when the live commit still looks acceptably fresh.
      #
      # "stalled" here means the poll step above genuinely FAILED (its
      # 15-minute wait ran out) — not the "not checked: live endpoint
      # exposes no commit" case, which also exits 0 but means the probe
      # could not tell either way and must never be reported as "caught up"
      # (Doctrine #1 — never report success while doing nothing).
      - name: Report to the "Production deploy stalled" issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          POLL_REASON: ${{ steps.poll.outputs.reason }}
        run: |
          STATUS_JSON=$(curl -s --max-time 20 https://gatetest.io/api/platform-status || echo '{}')
          echo "$STATUS_JSON" > platform-status.json
          LIVE_COMMIT=$(node -e "let d={};try{d=JSON.parse(require('fs').readFileSync('platform-status.json','utf8'))}catch{}; process.stdout.write(d.commit||'')")
          PULL_RESULT=$(node -e "let d={};try{d=JSON.parse(require('fs').readFileSync('platform-status.json','utf8'))}catch{}; process.stdout.write((d.lastPullDeploy&&d.lastPullDeploy.result)||'')")
          PULL_REASON=$(node -e "let d={};try{d=JSON.parse(require('fs').readFileSync('platform-status.json','utf8'))}catch{}; process.stdout.write((d.lastPullDeploy&&d.lastPullDeploy.reason)||'')" | tr -d '\r\n')

          if [ "$POLL_OUTCOME" = "failure" ]; then
            STATE="stalled"
            if [ "$PULL_RESULT" = "failed" ] && [ -n "$PULL_REASON" ]; then
              REASON="$PULL_REASON"
            else
              REASON="$POLL_REASON"
            fi
          elif [ "$POLL_OUTCOME" = "success" ] && [ -z "$POLL_REASON" ]; then
            STATE="resolved"
            REASON=""
          else
            # The ambiguous "not checked" case — genuinely unknown, never
            # reported as either stalled or resolved.
            echo "not checked: poll outcome ambiguous (outcome=$POLL_OUTCOME, reason=$POLL_REASON) — leaving any open deploy-stalled issue as-is"
            exit 0
          fi

          if [ -n "$LIVE_COMMIT" ] && git cat-file -e "$LIVE_COMMIT" 2>/dev/null; then
            git log --merges --oneline "$LIVE_COMMIT"..HEAD > merges.txt
          else
            : > merges.txt
          fi
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('merges.txt', 'utf8').split('\n').filter(Boolean);
            const out = lines.map((line) => {
              const i = line.indexOf(' ');
              return i === -1 ? { sha: line, subject: '' } : { sha: line.slice(0, i), subject: line.slice(i + 1) };
            });
            fs.writeFileSync('unshipped.json', JSON.stringify(out));
          "

          node scripts/ops/deploy-stalled-issue.js \
            --state "$STATE" \
            --reason "$REASON" \
            --box-command "journalctl -u gatetest-pull-deploy -n 100 --no-pager" \
            --source "deploy-box.yml poll-pull-deploy" \
            --unshipped-file unshipped.json

  verify:
    # Runs after `deploy` (workflow_dispatch) or `poll-pull-deploy` (push),
    # whichever the trigger ran, whether it succeeded, failed or was skipped.
    # Asks the live site which commit it serves and compares it with THIS
    # commit (scripts/ops/verify-deploy.js — exit 0 in sync, 1 lagging, 2
    # unreachable). A lag, or a failed deploy, becomes one issue labelled
    # `deploy-drift` — opened once, updated on every later run, closed by the
    # first run that verifies in sync. GITHUB_TOKEN only; no other secret.
    needs: [deploy, poll-pull-deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the lag is `git rev-list --count deployed..HEAD`.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare production with this commit
        id: verify
        run: |
          rc=0
          node scripts/ops/verify-deploy.js --expect "$GITHUB_SHA" --out verify.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Do not exit non-zero here: the issue step below must run on a lag.
          # The last step fails the job on the same rc.

      - name: Open, update or close the deploy-drift issue
        uses: actions/github-script@v7
        env:
          # `deploy` only runs on workflow_dispatch, `poll-pull-deploy` only on
          # push — exactly one of the two is ever not 'skipped' for a given
          # run, so this picks whichever one the trigger actually ran.
          DEPLOY_RESULT: ${{ needs.deploy.result != 'skipped' && needs.deploy.result || needs.poll-pull-deploy.result }}
          DEPLOY_REASON: ${{ needs.deploy.result != 'skipped' && needs.deploy.outputs.reason || needs.poll-pull-deploy.outputs.reason }}
          VERIFY_RC: ${{ steps.verify.outputs.rc }}
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'deploy-drift';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();

            let report = null;
            try { report = JSON.parse(fs.readFileSync('verify.json', 'utf8')); } catch { /* unreachable before a report was written */ }

            const deployResult = process.env.DEPLOY_RESULT || 'unknown';
            const deployReason = (process.env.DEPLOY_REASON || '').trim();
            const deploySucceeded = deployResult === 'success';
            const inSync = !!report && report.state === 'in-sync';
            const lagging = !!report && (report.state === 'lagging' || report.state === 'not-on-main');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request);

            if (inSync && deploySucceeded) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Resolved: production is on \`${report.deployed}\` — in sync with \`main\` as of ${now} ([run](${runUrl})). Closing.`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
                core.info(`Closed #${existing.number}: production is in sync.`);
              } else {
                core.info('Production is in sync; no drift issue open.');
              }
              return;
            }

            if (!lagging && deploySucceeded) {
              // Deploy landed but the site could not be compared (unreachable).
              // The job goes red below; the readiness probe owns "site down".
              core.warning(`No drift issue: deploy succeeded but verify reported ${report ? report.state : 'no report'}.`);
              return;
            }

            const behind = report && Number.isInteger(report.behind) ? report.behind : null;
            const title = behind !== null
              ? `Production is behind main by ${behind} commit${behind === 1 ? '' : 's'}`
              : 'Production is behind main (live commit could not be compared)';

            const deployed = report && report.deployed ? `\`${report.deployed}\`` : '_unreadable_';
            const version = report && report.version ? ` (v${report.version})` : '';
            const built = report && report.builtAt ? `, built ${report.builtAt} — ${report.age} ago` : '';
            const expected = (report && report.expected) || context.sha;
            const statusLine = report ? report.message : 'verify-deploy produced no report';
            const knownCause = /unexpected uncommitted changes/.test(deployReason);

            const body = [
              `Production is not running \`main\`. Every push to \`main\` runs this check; this issue is updated by each run and closes itself when a run verifies production in sync.`,
              '',
              '| | commit |',
              '|---|---|',
              `| deployed (${report ? report.url : '/api/platform-status'}) | ${deployed}${version}${built} |`,
              `| expected (\`main\` at this run) | \`${expected}\` |`,
              '',
              `**Verify result:** ${statusLine}`,
              '',
              `**Deploy job:** ${deployResult}${deployReason ? ` — \`${deployReason.replace(/`/g, "'")}\`` : ''}`,
              '',
              knownCause
                ? '**Fix for this cause (box-side uncommitted changes):** on the box: `cd /opt/gatetest && git status`; commit or discard, then re-run this workflow (Actions → Deploy to production box → Run workflow). `deploy-on-box.sh` refuses to `git reset --hard` over changes a human made; the files it dirties itself are already ignored (`SELF_DIRTIED`).'
                : '**Fix:** read the failing step in the run linked below. If the box refused on `unexpected uncommitted changes`: on the box: `cd /opt/gatetest && git status`; commit or discard, then re-run this workflow. If the secrets are missing: add `BOX_SSH_KEY` / `BOX_SSH_HOST` under Settings → Secrets and variables → Actions.',
              '',
              `Last checked ${now} by [this run](${runUrl}). Deploy log: the \`deploy-log\` artifact on that run.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              core.info(`Updated #${existing.number}: ${title}`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205', description: 'Production is not running main' });
            }
            const { data: issue } = await github.rest.issues.create({ owner, repo, title, body, labels: [LABEL] });
            core.info(`Opened #${issue.number}: ${title}`);

      - name: Fail when production is not on this commit
        if: steps.verify.outputs.rc != '0'
        env:
          VERIFY_RC: ${{ steps.verify.outputs.rc }}
        run: |
          echo "verify-deploy exited $VERIFY_RC (1 = lagging / not on main, 2 = unreachable) — see the step above"
          exit "$VERIFY_RC"
