name: Head to head — corpus vs other scanners

# Measures GateTest, Semgrep, ESLint (eslint-plugin-security) and CodeQL on
# the same pinned third-party commits the precision gate uses
# (reliability-corpus/real-world.json) and regenerates
# website/app/data/head-to-head.json, which /precision renders. Weekly rather
# than nightly: four tools over twenty repositories is an hour or more of
# runner time, and the table is a published comparison, not a gate.
#
# Nothing here fakes a number. Semgrep comes from pip on ubuntu (the Windows
# laptop that cut the first table needed the per-user Scripts dir on PATH;
# here it is a plain install). CodeQL comes from a pinned official CLI bundle
# installed below; the adapter still writes a repo as "not measured" with the
# reason whenever the CLI cannot build or analyse it — never a fabricated
# zero. SonarQube is NOT run — the script writes it as "not measured" with
# the reason — and this workflow never touches
# reliability-corpus/real-world.json: the ceilings belong to
# dogfood-nightly.yml's --ratchet run and to nothing else.

on:
  schedule:
    - cron: '0 5 * * 1'    # Monday 05:00 UTC, after the weekend's nightlies
  workflow_dispatch:
    inputs:
      repos:
        description: 'Limit to the first N repositories in priority order (blank = all twenty)'
        required: false
        default: ''

permissions:
  contents: write          # rolling PR branch push
  pull-requests: write

jobs:
  measure:
    name: Measure the corpus against Semgrep, ESLint and CodeQL
    runs-on: ubuntu-latest
    # Worst case is every tool (GateTest, Semgrep, ESLint, CodeQL's create +
    # analyze) hitting its ten-minute box on every repo; the realistic run is
    # well under two hours. The box is per tool, per repo, so a single slow
    # scanner cannot eat the whole job.
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # The OSS engine from PyPI. `--config auto` pulls the registry
        # ruleset for the languages it detects; no login is needed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade semgrep
          semgrep --version

      - name: Install CodeQL CLI
        # Pinned release of the official CodeQL CLI bundle (linux64) from
        # github/codeql-action — its query packs include the
        # `<lang>-security-extended.qls` suite scripts/head-to-head.js's
        # CodeQL adapter runs (isCodeqlBlocking documents the counting rule).
        # The tag is an exact release, never a mutable "latest"; the bundle is
        # verified against the checksum GitHub publishes for that same
        # immutable release before it is trusted or extracted.
        #
        # Licence: the CodeQL CLI's terms
        # (https://github.com/github/codeql-cli-binaries/blob/main/LICENSE.md)
        # permit analysing open-source codebases — every repository in
        # reliability-corpus/real-world.json is exactly that.
        env:
          CODEQL_RELEASE_TAG: codeql-bundle-v2.27.0
        run: |
          set -o pipefail
          BASE_URL="https://github.com/github/codeql-action/releases/download/${CODEQL_RELEASE_TAG}"
          curl -sSL --fail -o "$RUNNER_TEMP/codeql-bundle-linux64.tar.gz" "$BASE_URL/codeql-bundle-linux64.tar.gz"
          curl -sSL --fail -o "$RUNNER_TEMP/codeql-bundle-linux64.tar.gz.checksum.txt" "$BASE_URL/codeql-bundle-linux64.tar.gz.checksum.txt"
          if ! (cd "$RUNNER_TEMP" && sha256sum -c codeql-bundle-linux64.tar.gz.checksum.txt); then
            echo "CodeQL bundle checksum did not match the release's own checksum file — refusing to install it" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/codeql-home"
          tar -xzf "$RUNNER_TEMP/codeql-bundle-linux64.tar.gz" -C "$RUNNER_TEMP/codeql-home"
          if ! test -x "$RUNNER_TEMP/codeql-home/codeql/codeql"; then
            echo "CodeQL CLI did not extract to the expected path ($RUNNER_TEMP/codeql-home/codeql/codeql)" >&2
            exit 1
          fi
          echo "CODEQL_HOME=$RUNNER_TEMP/codeql-home/codeql" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/codeql-home/codeql" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codeql-home/codeql/codeql" version

      - name: Install all workspaces
        # Same script ci.yml and dogfood-nightly.yml use — a root-only
        # `npm ci` leaves modules that need a real npm package out of the
        # engine and under-counts GateTest's own column.
        run: bash scripts/install-workspaces.sh

      - name: Verify all modules load
        run: node bin/gatetest.js --list | wc -l

      - name: Measure
        # The script installs its throwaway ESLint toolchain, and builds each
        # repo's CodeQL database + SARIF output, in the temp dir — never in
        # this repository (tests/head-to-head.test.js pins that for both). A
        # repository that could not be cloned exits non-zero AFTER the file
        # is written for the ones that were — the red is visible here and
        # the PR step ships only what was measured.
        env:
          # Passed through env, never interpolated into the script: a
          # workflow_dispatch input is untrusted event data.
          LIMIT: ${{ github.event.inputs.repos }}
        run: |
          set -o pipefail
          mkdir -p .h2h
          GATETEST_NO_TELEMETRY=1 node scripts/head-to-head.js \
            ${LIMIT:+--repos "$LIMIT"} \
            --out website/app/data/head-to-head.json 2>&1 | tee .h2h/run.log && rc=0 || rc=$?
          echo "# exit $rc" >> .h2h/run.log
          cp website/app/data/head-to-head.json .h2h/head-to-head.json
          exit "$rc"

      - name: Validate the file the page will render
        if: always()
        run: node --test tests/head-to-head.test.js

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-to-head-${{ github.run_id }}
          path: .h2h/
          retention-days: 60

      - name: Open / update the head-to-head PR if the numbers changed
        # One rolling branch, one PR, reset onto main each run — the same
        # shape as dogfood-nightly.yml's flywheel/site-stats and for the
        # same reason: the file is fully regenerated every run, so the
        # newest is always a complete superset and there is nothing to
        # accumulate. Only head-to-head.json rides this PR; the corpus
        # ceilings and precision.json belong to the nightly.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          GENERATED="website/app/data/head-to-head.json"
          if git diff --quiet -- $GENERATED; then
            echo "head-to-head.json unchanged — nothing to ship"
            exit 0
          fi
          BRANCH="flywheel/head-to-head"
          git config user.name  "gatetest-dogfood[bot]"
          git config user.email "gatetest-dogfood@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/generated"
          cp "$GENERATED" "$RUNNER_TEMP/generated/head-to-head.json"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/generated/head-to-head.json" "$GENERATED"

          git add $GENERATED
          if git diff --cached --quiet; then
            echo "already current on main — nothing to ship"
            exit 0
          fi
          git -c commit.gpgsign=false commit -m "chore(precision): refresh the head-to-head table $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH" --force

          PR_BODY=$(printf 'Weekly head-to-head run refreshed `website/app/data/head-to-head.json` — GateTest, Semgrep, ESLint (eslint-plugin-security) and CodeQL on the same pinned corpus commits, rendered at /precision.\n\nEvery number is this run'"'"'s own measurement (`scripts/head-to-head.js`). A tool that timed out, failed or could not be installed is written as such; CodeQL is written as not measured (with the reason) for any repo it could not build or analyse; SonarQube is always written as not measured, with the reason. Nothing in this PR touches the corpus ceilings.\n\nThis is a ROLLING PR — it is reset onto `main` every run, so it always shows the current table against current `main`.')
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh the head-to-head table — $(date -u +%Y-%m-%d)" \
            --body "$PR_BODY" \
          || gh pr edit "$BRANCH" \
               --title "Refresh the head-to-head table — $(date -u +%Y-%m-%d)" \
               --body "$PR_BODY"

          gh pr ready "$BRANCH" || echo "gh pr ready: already ready, or unavailable ($?)"
          gh pr merge "$BRANCH" --auto --squash || echo "auto-merge unavailable — PR left open for review"
