name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 2026-09-19: GitHub does not start `pull_request` workflows for events
  # created with secrets.GITHUB_TOKEN, so a bot-opened/updated PR branch
  # (dogfood-nightly.yml, trainer-nightly.yml, head-to-head.yml) never gets
  # this workflow's required checks and sits BLOCKED forever. workflow_dispatch
  # IS one of GitHub's documented exceptions — it starts workflows even when
  # triggered via GITHUB_TOKEN, and a workflow_dispatch run on branch X
  # attaches its check runs to X's head commit with the same job names used
  # on pull_request, which is what required status checks match on. No
  # inputs needed — scripts/ops/dispatch-required-ci.sh just names the ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast TypeScript gate — runs first, blocks the slower test + build jobs
  # on type errors. Catches the cache-cold Vercel regressions that have
  # been slipping through Next.js's build-time tsc (we've had 4 in 24h:
  # AdaptiveState duplicate, turbopack dynamic require, orphan tracker,
  # AuthFailure.headers). `tsc --noEmit` is ~10s vs ~2-3min for the full
  # build — fast feedback, clear failure message, no Turbopack noise.
  typecheck:
    name: TypeScript (website)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Run tsc --noEmit
        run: cd website && npx tsc --noEmit

  # Heavy tests — subprocess-heavy, CLI-driven, real-timer tests that would
  # bloat the fast gate. Runs in parallel from t=0 (no `needs`), so it never
  # delays the blocking path. NOT in required checks — a failure marks the
  # check red + posts a step summary but never blocks a merge. The fast gate
  # (test job + pre-merge-sweep) is the actual enforcement layer.
  # Bible Forbidden #24: NO continue-on-error on the test step itself.
  heavy-tests:
    name: Heavy Tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Install website dependencies
        run: cd website && npm ci

      # tests/heavy/admin-signed-in-smoke.test.js starts `next start` against
      # this build. Built here, once, because Node 22 applies --test-timeout
      # to the whole test file, hooks included, and a cold build on this
      # runner is longer than the 120 s cap below (#725).
      - name: Build the website once for the signed-in smoke test
        run: cd website && npx next build

      - name: Run heavy test suite
        id: heavy
        run: |
          set -o pipefail
          # scripts/run-tests.js: one plain `node --test` per file, ended only
          # after its summary is read. `--test-force-exit` across files cut
          # children off mid-stream and still exited 0 (measured 2026-09-05).
          node scripts/run-tests.js --timeout 120000 tests/heavy/*.test.js | tee /tmp/heavy-suite.tap
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "## Heavy test failures" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 14 "^✗ " /tmp/heavy-suite.tap | head -120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Post summary on success
        if: success()
        run: |
          PASS=$(awk '/^# pass /{p=$3} END{print p+0}' /tmp/heavy-suite.tap)
          echo "## Heavy tests: $PASS passed" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test + Build
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Install website dependencies (some tests require @babel/* via website helpers)
        run: cd website && npm ci

      - name: Run tests
        run: npm test

      - name: Build website
        run: cd website && npm run build

  gatetest:
    name: GateTest Quality Gate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      # Required by github/codeql-action/upload-sarif — it calls the
      # workflow-runs API to attach SARIF results to the right run.
      # Without this, the upload step fails with "Resource not accessible
      # by integration", turning the job red even when the gate passed.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so `--diff` can compute the merge-base
          # against main for incremental scans on PRs. Without this,
          # checkout defaults to depth=1 and the merge-base lookup falls
          # back to full scan, costing the speedup.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Run GateTest quick scan
        # --confidence-threshold 0.95 downgrades low-confidence error findings
        # to "soft" (visible in report, don't block the gate). Used on this
        # SARIF-upload job because its primary purpose is feeding the GitHub
        # Security tab — the strict blocking gate is the `self-scan` job
        # below, which runs with the default 0.7 threshold.
        # --diff scans only files changed vs merge-base with main (PR) or
        # HEAD~1 (push). PR scan drops from ~30s to ~3-10s. Falls back to
        # full scan when no merge-base resolvable (initial commit, etc).
        run: node bin/gatetest.js --suite quick --sarif --junit --confidence-threshold 0.95 --parallel --diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Security
        # ONE Code Scanning configuration for both SARIF jobs (`category`
        # below, shared with gatetest-full). Before this, each job uploaded
        # under its default category (workflow:job), so every PR check
        # carried "1 configuration present on main was not found" —
        # gatetest-full only runs on main.
        #
        # PR-only: on push to main the full job's upload IS the baseline
        # every PR is compared against, and a diff-scoped upload landing
        # after it under the same category would shrink that baseline to
        # one commit's findings, making old alerts read as new on every PR.
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .gatetest/reports/
          category: gatetest
        continue-on-error: true

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatetest-report
          path: .gatetest/reports/
          retention-days: 30

  # Self-scan gate — the SAME quick scan we sell to customers must pass on
  # OUR repo before any merge. Catches the "shipped a scanner that flags
  # itself" bug class. Bible Forbidden #24 — NO continue-on-error on the
  # gate step. If the gate is BLOCKED, this job fails the workflow.
  self-scan:
    name: GateTest Self-Scan (Dogfood Gate)
    runs-on: ubuntu-latest
    needs: gatetest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Same history as the Quality Gate job above. At depth 1 prSize
          # finds no merge-base and reports "PR-size check skipped", so the
          # two self-scan jobs measured different things on the same PR
          # (KI #107): one blocked #426 at 3,526 lines, the other said
          # nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Run quick self-scan against the gatetest repo itself
        # JsonReporter is always attached — produces
        # .gatetest/reports/gatetest-report-latest.json which the
        # publish step parses for the live trust badge.
        # --parallel runs the 40+ modules concurrently (~3x speedup on
        # 8-core runners). Module checks are CPU-bound but each module
        # is independent, so Promise.all is safe — no shared mutable state.
        run: node bin/gatetest.js --suite quick --parallel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort publish of the self-scan result to gatetest.io for
      # the live trust badge. Fail-soft — `publish-self-scan.js` always
      # exits 0 so a network blip or missing token never breaks CI.
      - name: Publish self-scan stats to live badge endpoint
        if: always()
        run: node scripts/publish-self-scan.js
        env:
          GATETEST_INTERNAL_TOKEN: ${{ secrets.GATETEST_INTERNAL_TOKEN }}
          SELF_SCAN_STATUS_URL: ${{ vars.SELF_SCAN_STATUS_URL }}

  # Pre-merge sweep — every check that would block a hand-merge runs here
  # as a SEPARATE STEP, so one failure doesn't hide three others. Runs on
  # every PR. This is the "did the sweep actually pass?" enforcement.
  pre-merge-sweep:
    name: Pre-Merge Sweep
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: All tests pass
        run: |
          set -o pipefail
          # scripts/run-tests.js runs one plain `node --test` per file and ends
          # the child only after its final summary line has been read — so a
          # leaked timer/socket/child (the 2.5h hang) is killed on our terms,
          # after every result is in. The `--test-force-exit` flag it replaces
          # exited as soon as the tests it had HEARD OF were done: children
          # still streaming were cut off, their tests never counted, exit 0
          # (measured 2026-09-05: the same tree reported 50, 77 and 61 tests).
          # A file whose stream ends without a summary is a FAILURE here.
          node scripts/run-tests.js --timeout 60000 tests/*.test.js | tee /tmp/test-suite.tap
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=========================================================="
            echo "  TEST FAILURES (extracted for CI-log-tail visibility):"
            echo "=========================================================="
            grep -A 14 "^✗ " /tmp/test-suite.tap || echo "(no failing file block found — failure may be a process-level error)"
            echo "=========================================================="
            exit "$STATUS"
          fi

      - name: Website builds clean
        run: cd website && npx next build

      - name: Lint (src/bin/lib/integrations)
        run: npm run lint

      - name: All modules load (assert >= 90)
        run: |
          OUTPUT="$(node bin/gatetest.js --list)"
          echo "$OUTPUT"
          LINES="$(printf '%s\n' "$OUTPUT" | wc -l)"
          echo "module list line count: $LINES"
          if [ "$LINES" -lt 120 ]; then
            echo "FAIL: expected at least 120 module-list lines, got $LINES" >&2
            exit 1
          fi

      # Blocking on purpose. Every other check in this file runs from a git
      # checkout, where website/ exists — which is why KI #74 shipped SEVEN
      # binaries that loaded from website/ and died with MODULE_NOT_FOUND for
      # `npm i -g` users while this workflow stayed green. reliability-corpus.yml
      # was literally invoking one of the broken binaries and passing.
      #
      # This packs the real tarball and runs every shipped binary from it, so it
      # is the only check here that sees what a customer sees. ~4s.
      - name: Published package actually runs (npm pack smoke)
        run: node scripts/run-tests.js --timeout 300000 tests/heavy/package-smoke.test.js

      # Blocking because it has earned it. Every risky token in the fixture sits
      # inside a string or comment, so any finding naming that file is a false
      # positive by construction. It has caught four real defects so far, two of
      # them ERROR severity that would fail a customer's build over a quoted
      # code sample: money-float:js-parse-float, data:pii, auth-bypass (which had
      # no string guard at all), integration:untested. ~1s.
      - name: No module flags inert code (false-positive gate)
        run: node scripts/run-tests.js --timeout 300000 tests/heavy/inert-fixture-sweep.test.js

      - name: Self-scan green
        run: node bin/gatetest.js --suite quick --parallel

      - name: No committed secrets in tracked files
        run: |
          # Look for high-shape secret patterns in tracked files, excluding
          # docs/tests/examples paths and the .gitignore itself.
          PATTERN='AKIA[0-9A-Z]{16}|AKIB[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk_test_[0-9a-zA-Z]{24,}|ghp_[0-9a-zA-Z]{36,}|github_pat_[0-9a-zA-Z_]{60,}|glpat-[0-9a-zA-Z_-]{20,}|SG\.[0-9a-zA-Z_-]{22,}\.[0-9a-zA-Z_-]{43,}'
          FILES="$(git ls-files | grep -Ev '^(\.gitignore|\.env\.example|tests/|docs/)' || true)"
          if [ -z "$FILES" ]; then
            echo "no tracked files to scan"
            exit 0
          fi
          # AWS publishes AKIAIOSFODNN7EXAMPLE / AKIAI44QH8DHBEXAMPLE as
          # deliberately non-functional documentation keys, and src/modules/secrets.js
          # names one in a comment explaining why its `example` suppression is
          # word-bounded. A secrets DETECTOR has to be able to write down the
          # shapes it detects. Filtering only the documented ...EXAMPLE form keeps
          # every real-shaped AKIA key failing this step.
          ALLOW='AKIA[0-9A-Z]*EXAMPLE'
          HITS="$(printf '%s\n' "$FILES" | xargs -d '\n' grep -EnH "$PATTERN" 2>/dev/null | grep -Ev "$ALLOW" || true)"
          if [ -n "$HITS" ]; then
            echo "FAIL: secret-shape strings found in tracked files:" >&2
            printf '%s\n' "$HITS" >&2
            exit 1
          fi
          echo "no secret-shape strings found"

      - name: TODO/FIXME count (informational, never fails)
        run: |
          COUNT="$(git grep -EnI 'TODO|FIXME' -- 'src/**/*.js' 'src/**/*.ts' 'website/app/**/*.ts' 'website/app/**/*.tsx' 'website/app/**/*.js' 2>/dev/null | wc -l || echo 0)"
          echo "TODO/FIXME occurrences in src/ and website/app/: $COUNT"

  gatetest-full:
    name: GateTest Full Scan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    # Runs on pull requests too (2026-09-16). It was push-to-main only, and
    # not required, so main sat red for a day on three rule false positives
    # that no PR had ever been asked to pass. Same suite, same skips; the
    # SARIF upload below stays gated to main so it remains main's baseline.
    #
    # workflow_dispatch too (2026-09-19): this job is one of the four
    # required checks, and a bot-authored PR's workflow_dispatch nudge
    # (scripts/ops/dispatch-required-ci.sh) must produce the same check run
    # on that branch's head commit that a human PR gets — excluding this
    # event here would leave the job SKIPPED (not reported) on a dispatched
    # run, which required status checks treat the same as never running.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      security-events: write
      contents: read
      # Required by github/codeql-action/upload-sarif — see comment on
      # the `gatetest` job above. Without this, every push to main has
      # a red SARIF-upload step even when the gate verdict is green.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all workspaces
        run: bash scripts/install-workspaces.sh

      - name: Run GateTest full scan
        # This job was NAMED "Full Scan" and ran `--suite quick` from the day
        # it was written until 2026-09-06 (#418's audit found it; the comment
        # above the step cited a nightly-mutation.yml that does not exist).
        # It now runs the full deterministic suite — the same set the nightly
        # dogfood measures (dogfood-nightly.yml), minus the four modules that
        # need the repo's own test runner or a browser: mutation (~28 min,
        # mutation-nightly.yml), e2e, unitTests, dataIntegrity. Measured
        # 2026-09-06 on main: GATE PASSED, 0 blocking, 37 s. No
        # continue-on-error on this step (Bible Forbidden #24).
        # --confidence-threshold 0.95 — same rationale as the quick-scan job
        # above. This is the SARIF-feeding job, not the dogfood gate. The
        # strict `self-scan` job keeps the default 0.7 and is the one that
        # decides whether main is green.
        run: >-
          node bin/gatetest.js --suite full --sarif --junit --confidence-threshold 0.95 --parallel
          --skip-module mutation --skip-module e2e --skip-module unitTests --skip-module dataIntegrity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATETEST_NO_TELEMETRY: '1'

      - name: Upload SARIF to GitHub Security
        # Same category as the PR job above — this upload is main's
        # baseline for every PR's "new alerts" comparison; PR runs of
        # this job must not overwrite it.
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .gatetest/reports/
          category: gatetest
        continue-on-error: true

      - name: Upload full scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatetest-full-report
          path: .gatetest/reports/
          retention-days: 90
